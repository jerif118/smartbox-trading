name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]"

      # Tests son la puerta que SÍ bloquea el merge.
      - name: Run tests (excluye slow)
        run: pytest -q -m "not slow" --cov=src --cov-report=term-missing --cov-report=xml

      # La suite de regresión (las 22 reglas) también bloquea.
      - name: Regression suite
        run: pytest -q -m regression

  quality:
    name: Lint + types (informativo)
    runs-on: ubuntu-latest
    # No bloquea el merge todavía: el repo tiene deuda de lint/tipos preexistente.
    # Se endurece a bloqueante por módulo a medida que se limpia (ver pyproject
    # [tool.mypy] overrides). Quitar continue-on-error cuando ruff/mypy estén en verde.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format)
        run: ruff format --check src tests

      - name: Mypy (capas puras)
        run: mypy src/domain src/pipeline
