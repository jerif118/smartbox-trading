# SmartBox Trading v2 — Docker Compose
#
# USO RÁPIDO:
#   docker compose up -d --build    # arranca bot + UI en background
#   docker compose logs -f           # ver logs
#   docker compose down              # parar todo
#
# El bot corre como "one-shot" (termina tras cada corrida).
# La UI queda corriendo para ver el dashboard en http://localhost:8501
#   docker compose up -d ui          # solo el dashboard, sin disparar un run
#
# Para correr el bot con cron del host (la señal se busca en las 2h
# posteriores al cierre de la caja, p.ej. caja 08:00-09:55 NY → corre
# cada 5 min entre 10:00 y 11:55 NY):
#   */5 10-11 * * 1-5 cd /ruta && docker compose run --rm bot >> /tmp/smartbox.log 2>&1
#
# Para correr el bot periódicamente DENTRO de Docker, descomenta el servicio `scheduler`.

services:
  # ── Bot: corre el pipeline una vez y termina ────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartbox-trading:latest
    container_name: smartbox-bot
    env_file:
      - .env
    environment:
      TZ: America/New_York
      DATA_LOADER_PATH: /app/data/parquet
      VP_LOADER_PATH: /app/data/parquet/vp
      LOG_DIR: /app/logs
      DB_PATH: /app/data/smartbox.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs
    command: ["python", "-m", "interfaces.cli.main", "run"]
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "from interfaces.cli.main import main; main(['doctor'])"]
      interval: 5m
      timeout: 30s
      start_period: 30s
      retries: 3

  # ── UI: dashboard Streamlit, persistente ────────────────────────────────
  ui:
    image: smartbox-trading:latest
    container_name: smartbox-ui
    env_file:
      - .env
    environment:
      TZ: America/New_York
      DB_PATH: /app/data/smartbox.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - bot_data:/app/data      # comparte la DB con el bot
    command: >
      streamlit run src/interfaces/streamlit/app.py
        --server.address=0.0.0.0
        --server.port=8501
        --server.headless=true
        --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Scheduler OPCIONAL: corre el bot cada día a las 7:50 AM NY ──────────
  # Descomenta si quieres que el propio Docker maneje la recurrencia.
  # Requiere que el servicio `bot` esté como "service" (no "one-shot").
  # Si lo activas, cambia el `command` del bot a un loop o quítalo y deja solo scheduler.
  #
  # scheduler:
  #   image: mcuadros/ofelia:latest
  #   container_name: smartbox-scheduler
  #   command: daemon
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   labels:
  #     ofelia.enabled: "true"
  #     ofelia.job-execute.bot.schedule: "0 50 7 * * 1-5"
  #     ofelia.job-execute.bot.image: "smartbox-trading:latest"
  #     ofelia.job-execute.bot.command: "python -m interfaces.cli.main run"
  #     ofelia.job-execute.bot.network: "smartbox_default"
  #   depends_on:
  #     - bot

volumes:
  bot_data:
    name: smartbox_data
  bot_logs:
    name: smartbox_logs
