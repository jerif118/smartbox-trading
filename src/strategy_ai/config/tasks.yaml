# =============================================================================
# TASKS YAML - Simplified crew workflow
# 3 agents: decision_maker (manager) + trader + risk_analyst (workers)
# Communication via CrewAI task delegation, not fake debate tools
# =============================================================================

prepare_macro:
  description: >
    Scraper calendario macro para el día actual. Filtrar solo HIGH impact events.
    Si market_tz=America/New_York, eventos NY session importan más.
    Output: macro_risk (LOW/MEDIUM/HIGH) + lista de eventos de alto impacto.
  expected_output: >
    {
      "symbol": "<str>",
      "macro_risk": "LOW|MEDIUM|HIGH",
      "high_impact_events": [{ "event": "...", "time": "...", "currency": "..." }]
    }
  agent: decision_maker

analyze_pattern:
  description: >
    Analizar patrón de caja con últimas velas. Evaluar:
    - Forma caja (ancha/estrecha/simétrica)
    - Niveles clave VP (POC vs box_high/low)
    - Confluence factors para LONG/SHORT
    Proponer dirección inicial. Si no hay confluence clara → NO_OPERAR.
  expected_output: >
    {
      "symbol": "<str>",
      "proposed_direction": "LONG|SHORT|NO_OPERAR",
      "confidence": 0-100,
      "pattern_notes": "patrón observado...",
      "confluence_factors": ["factor1", "factor2"],
      "key_levels": { "box_high": <float>, "box_low": <float>, "poc": <float|null> }
    }
  agent: trader

evaluate_risk:
  description: >
    Evaluar propuesta del trader. Tasks:
    1. Calcular R:R ratio (min 1.5:1 para APPROVE)
    2. Si RSI + dirección conflictiva → caution
    3. Si macro_risk=HIGH + evento cercano → VETO
    4. Si confluencia <2 → modificar o vetar
    Output debe incluir recommendation: APPROVE|MODIFY|VETO
  expected_output: >
    {
      "symbol": "<str>",
      "recommendation": "APPROVE|MODIFY|VETO",
      "risk_mode": "COMPLETO|MEDIO|NO_OPERAR",
      "rr_ratio": <float|null>,
      "worst_case": "descripción escenario peor",
      "cautions": ["problema 1"],
      "vetoed": true/false,
      "confidence": 0-100
    }
  agent: risk_analyst

final_decision:
  description: >
    Decisión final. Si risk_analyst VETO → NO_OPERAR.
    Sinon, usar direction del trader.
    Compilar reasons de ambos agentes (trader + risk_analyst).
    Output JSON estructurado para orden de trading.
  expected_output: >
    {
      "decisions": [{
        "symbol": "<str>",
        "action": "LONG|SHORT|NO_OPERAR",
        "risk": "COMPLETO|MEDIO",
        "confidence": 0-100,
        "reasons": ["trader reason 1", "risk analyst reason 1"],
        "key_levels": { "box_high": <float>, "box_low": <float>, "poc": <float|null> },
        "signal": { "breakout_state": "ABOVE|BELOW", "candle_close": <float|null> },
        "team_consensus": "unanimous|vetado"
      }]
    }
  agent: decision_maker