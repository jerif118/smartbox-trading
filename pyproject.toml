[project]
name = "strategy_ai"
version = "0.2.0"
description = "SmartBox Trading — agente CrewAI para estrategia de caja en apertura US"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[tools]>=1.9.3",
    "pandas>=2.0",
    "pandas_ta>=0.3.14b1",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "streamlit>=1.32",
    "plotly>=5.18",
    "streamlit-autorefresh>=1.0.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "colorlog>=6.7",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
smartbox = "interfaces.cli.main:main"
smartbox_ui = "interfaces.streamlit.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/domain",
    "src/application",
    "src/infrastructure",
    "src/pipeline",
    "src/interfaces",
    "src/utils",
]

[tool.crewai]
type = "crew"

# ── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────────────────
# Arranque laxo: tipa las capas puras (domain, pipeline) sin bloquear el resto.
# Se endurece por módulo con el tiempo (subir a strict cuando estén limpias).
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Solo estas capas se comprueban de momento; el resto se añade al limpiarlas.
[[tool.mypy.overrides]]
module = ["infrastructure.*", "application.*", "interfaces.*"]
ignore_errors = true

# ── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "regression: tests que verifican las 22 reglas originales de la estrategia",
    "domain: tests puros de la capa de dominio (sin I/O)",
    "slow: tests que tardan más de 1s",
]
