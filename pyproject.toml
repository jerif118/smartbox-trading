[project]
name = "strategy_ai"
version = "0.1.0"
description = "SmartBox Trading — agente CrewAI para estrategia de caja en apertura US"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "pandas>=2.0",
    "pandas_ta>=0.3.14b1",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pydantic>=2.0",
    "colorlog>=6.7",
]

[project.scripts]
strategy_ai      = "strategy_ai.main:run"
run_crew         = "strategy_ai.main:run"
train            = "strategy_ai.main:train"
replay           = "strategy_ai.main:replay"
test             = "strategy_ai.main:test"
run_with_trigger = "strategy_ai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ─── Hatchling: src layout con varios paquetes top-level ────────────────
# El directorio src/ no es un paquete (no tiene __init__.py); cada
# subdirectorio se publica como paquete independiente para que los
# imports `from utils.logger import ...`, `from preprocess... import ...`
# funcionen tanto en desarrollo (`pip install -e .`) como en producción.
[tool.hatch.build.targets.wheel]
packages = [
    "src/broker_api",
    "src/preprocess",
    "src/strategy_ai",
    "src/tools_bot",
    "src/utils",
]

[tool.hatch.build.targets.wheel.force-include]
"src/strategy_ai/config/agents.yaml" = "strategy_ai/config/agents.yaml"
"src/strategy_ai/config/tasks.yaml"  = "strategy_ai/config/tasks.yaml"

[tool.crewai]
type = "crew"
